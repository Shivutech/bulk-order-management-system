<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Bulk Order</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<div class="container mt-5 mb-5">

    <div class="d-flex justify-content-between
                align-items-center mb-4">

        <h2>Create Bulk Order</h2>

        <a href="{% url 'order_list' %}"
           class="btn btn-secondary">

            Back to Orders

        </a>

    </div>


    {% if messages %}

        {% for message in messages %}

            <div class="alert alert-danger">

                {{ message }}

            </div>

        {% endfor %}

    {% endif %}


    <div class="card shadow-sm">

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}


                <!-- Customer -->

                <h5 class="mb-3">
                    Customer Information
                </h5>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Customer Name
                        </label>

                        <input
                            type="text"
                            name="customer_name"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Customer Email
                        </label>

                        <input
                            type="email"
                            name="customer_email"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Delivery Date
                        </label>

                        <input
                            type="date"
                            name="delivery_date"
                            class="form-control"
                            required
                        >

                    </div>

                </div>


                <hr>


                <!-- Products -->

                <h5 class="mb-3">
                    Order Items
                </h5>


                <div id="product-container">


                    <div class="row product-row mb-3">

                        <div class="col-md-6">

                            <label class="form-label">
                                Product
                            </label>

                            <select
                                name="product_id"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Product
                                </option>

                                {% for product in products %}

                                    <option value="{{ product.id }}">

                                        {{ product.name }}
                                        - ₹{{ product.price }}
                                        (Stock: {{ product.stock }})

                                    </option>

                                {% endfor %}

                            </select>

                        </div>


                        <div class="col-md-4">

                            <label class="form-label">
                                Quantity
                            </label>

                            <input
                                type="number"
                                name="quantity"
                                class="form-control"
                                min="1"
                                required
                            >

                        </div>


                        <div class="col-md-2 d-flex
                                    align-items-end">

                            <button
                                type="button"
                                class="btn btn-danger remove-row">

                                Remove

                            </button>

                        </div>

                    </div>

                </div>


                <button
                    type="button"
                    id="add-product"
                    class="btn btn-outline-dark mb-4">

                    + Add Another Product

                </button>


                <hr>


                <button
                    type="submit"
                    class="btn btn-dark">

                    Create Bulk Order

                </button>

            </form>

        </div>

    </div>

</div>


<script>

const container =
    document.getElementById('product-container');

const addButton =
    document.getElementById('add-product');


addButton.addEventListener('click', function () {

    const firstRow =
        document.querySelector('.product-row');

    const newRow =
        firstRow.cloneNode(true);

    newRow.querySelector('select').value = '';

    newRow.querySelector('input').value = '';

    container.appendChild(newRow);

});


container.addEventListener('click', function (event) {

    if (event.target.classList.contains('remove-row')) {

        const rows =
            document.querySelectorAll('.product-row');

        if (rows.length > 1) {

            event.target
                .closest('.product-row')
                .remove();

        }

    }

});

</script>

</body>

</html>
