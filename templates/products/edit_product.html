<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Product</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow-sm">

        <div class="card-body">

            <h2 class="mb-4">
                Edit Product
            </h2>

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Product Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        value="{{ product.name }}"
                        class="form-control"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Description
                    </label>

                    <textarea
                        name="description"
                        class="form-control"
                    >{{ product.description }}</textarea>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Price
                    </label>

                    <input
                        type="number"
                        name="price"
                        value="{{ product.price }}"
                        class="form-control"
                        step="0.01"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Stock
                    </label>

                    <input
                        type="number"
                        name="stock"
                        value="{{ product.stock }}"
                        class="form-control"
                        min="0"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Minimum Stock
                    </label>

                    <input
                        type="number"
                        name="minimum_stock"
                        value="{{ product.minimum_stock }}"
                        class="form-control"
                        min="0"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-dark">

                    Update Product

                </button>

                <a
                    href="{% url 'product_list' %}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
